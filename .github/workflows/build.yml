name: Build

# Runs on every push to main. Produces a debug APK you can grab from the run's
# artifacts. Releases are cut separately by pushing a tag — see release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The bundled puzzles are generated from art/icons-10.txt, so a hand-edit to
      # BundledPack.kt would silently diverge from the art. Regenerate and fail if
      # the result differs. This also re-validates every picture: the bundler
      # refuses to emit a puzzle that isn't uniquely solvable.
      # picross-gen is a separate Gradle build with no wrapper of its own, so it
      # is driven by the root wrapper via -p. Paths are absolute because the run
      # task's working directory is the nested project dir, not the repo root.
      # picross-gen is a separate Gradle build with no wrapper of its own, so it
      # is driven by the root wrapper via -p. Paths are absolute because the run
      # task's working directory is the nested project dir, not the repo root.
      #
      # Regenerating and diffing keeps the art and the shipped puzzles from
      # drifting apart, and re-validates every picture on the way through: the
      # bundler refuses to emit a design that isn't uniquely solvable.
      - name: Puzzle packs match the art files
        run: |
          set -euo pipefail
          check() {
            local art="$1" pack="$2" const="$3" id="$4"
            cp "$pack" "/tmp/$(basename "$pack").orig"
            ./gradlew --no-daemon -p tools/picross-gen run --args="bundle \
              --art $GITHUB_WORKSPACE/$art \
              --kotlin $GITHUB_WORKSPACE/$pack \
              --const $const --pack-id $id --out /tmp/packs-check"
            if ! diff -u "/tmp/$(basename "$pack").orig" "$pack"; then
              echo "::error::$pack is out of date for $art. Regenerate it — see README.md." >&2
              exit 1
            fi
          }
          check art/icons-10.txt tool/src/main/kotlin/com/gios/lightnonogram/data/BundledPack.kt   BUNDLED_PACK_10 bundled-10
          check art/icons-15.txt tool/src/main/kotlin/com/gios/lightnonogram/data/BundledPack15.kt BUNDLED_PACK_15 bundled-15

      - name: Generator tests
        run: ./gradlew --no-daemon -p tools/picross-gen test

      - name: Run app checks
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug --stacktrace

      # v0.1.2 crashed at launch on a Regex the JVM accepted and Android's
      # ICU-backed Pattern rejected — an unescaped closing brace. It compiled,
      # linted and passed every unit test, because the tests ran on the JVM.
      # The tool module has no need for regex; the JVM-only generator still does.
      - name: No java.util.regex in the tool module
        run: |
          set -euo pipefail
          if grep -rn --include="*.kt" -E "\bRegex\(|Pattern\.compile" tool/src/main; then
            echo "::error::Regex in tool/src/main. Android's Pattern is ICU-backed and rejects patterns OpenJDK accepts, so a JVM-green test proves nothing. Parse with MiniJson, or add an explicit exemption here with a comment saying why the pattern is safe on ICU." >&2
            exit 1
          fi
          echo "ok: no regex in the tool module"

      - name: Generated SDK registry is in the APK
        # The SDK finds @InitialScreen through a KSP-generated registry that
        # LightActivity loads with Class.forName. If KSP isn't wired up the class
        # is simply never generated, the build still succeeds, and the tool
        # crashes the instant it opens. v0.1.0 shipped exactly that.
        run: python3 scripts/check_registry.py tool/build/outputs/apk/debug/tool-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonogram-debug-apk
          path: tool/build/outputs/apk/debug/tool-debug.apk
          if-no-files-found: error
