name: Build

# Runs on every push to main. Produces a debug APK you can grab from the run's
# artifacts. Releases are cut separately by pushing a tag — see release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The bundled puzzles are generated from art/icons-10.txt, so a hand-edit to
      # BundledPack.kt would silently diverge from the art. Regenerate and fail if
      # the result differs. This also re-validates every picture: the bundler
      # refuses to emit a puzzle that isn't uniquely solvable.
      # picross-gen is a separate Gradle build with no wrapper of its own, so it
      # is driven by the root wrapper via -p. Paths are absolute because the run
      # task's working directory is the nested project dir, not the repo root.
      - name: Puzzle pack matches art/icons-10.txt
        run: |
          set -euo pipefail
          pack="tool/src/main/kotlin/com/gios/lightnonogram/data/BundledPack.kt"
          cp "$pack" /tmp/BundledPack.kt.orig
          ./gradlew --no-daemon -p tools/picross-gen run --args="bundle \
            --art $GITHUB_WORKSPACE/art/icons-10.txt \
            --kotlin $GITHUB_WORKSPACE/$pack \
            --out /tmp/packs-check"
          if ! diff -u /tmp/BundledPack.kt.orig "$pack"; then
            echo "::error::BundledPack.kt is out of date. Regenerate it with the bundle command in README.md." >&2
            exit 1
          fi

      - name: Generator tests
        run: ./gradlew --no-daemon -p tools/picross-gen test

      - name: Run app checks
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonogram-debug-apk
          path: tool/build/outputs/apk/debug/tool-debug.apk
          if-no-files-found: error
